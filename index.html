<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Calculator</title>

<link rel="manifest" href="manifest.json">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

body {
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: stretch;
}

.calculator {
  width: 100%;
  max-width: 500px;
  min-height: 100dvh;
  background: #000;
  padding: 18px 16px 16px;

  display: flex;
  flex-direction: column;

  border-radius: 0;
  box-shadow: none;

  transform: none !important;
  animation: none !important;
  transition: none !important;

  touch-action: manipulation;
}

/* TOP BAR */

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;

  min-height: 48px;
  margin-bottom: 4px;
}

.app-name {
  font-size: 20px;
  font-weight: 600;
  color: #fff;
}

.top-actions {
  display: flex;
  gap: 10px;
}

.small-btn {
  width: 42px;
  height: 42px;

  border: 0;
  border-radius: 50%;

  background: #000;
  color: #fff;

  font-size: 18px;
  cursor: pointer;
}

/* DISPLAY */

.display {
  flex: 1;

  min-height: 0;

  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;

  padding: 20px 4px 22px;

  overflow: hidden;
}

.expression {
  width: 100%;

  text-align: right;

  font-size: clamp(34px, 10vw, 54px);
  font-weight: 500;

  line-height: 1.15;

  color: #777;

  word-break: break-all;
}

.answer {
  width: 100%;

  min-height: 48px;

  margin-top: 8px;

  text-align: right;

  font-size: clamp(42px, 12vw, 64px);
  font-weight: 500;

  line-height: 1.1;

  color: #fff;

  cursor: pointer;

  word-break: break-all;
}

.status {
  height: 20px;

  margin-top: 4px;

  font-size: 12px;

  color: #777;

  text-align: right;
}

/* KEYPAD */

.keys {
  width: 100%;

  display: grid;

  grid-template-columns: repeat(4, 1fr);

  gap: 12px;

  padding-bottom: 4px;
}

button.key {
  width: 100%;

  min-height: 68px;

  border: 0;

  border-radius: 50%;

  background: #292929;

  color: #fff;

  font-size: 24px;
  font-weight: 500;

  cursor: pointer;

  transition:
    transform 0.08s ease,
    background 0.08s ease;
}

button.key:active {
  transform: scale(0.94);
  background: #3a3a3a;
}

button.operator {
  background: #321719;
  color: #ff6b6b;
}

button.clear {
  color: #ff6b6b;
}

button.equal {
  background: #ff6b6b;
  color: #fff;
}

button.zero {
  grid-column: span 2;

  border-radius: 40px;
}

/* HISTORY */

.history-panel {
  display: none;

  position: absolute;

  left: 12px;
  right: 12px;
  top: 70px;

  z-index: 10;

  border-radius: 18px;

  background: #1c1c1c;

  padding: 12px;

  max-height: 230px;

  overflow-y: auto;

  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.history-panel.show {
  display: block;
}

.history-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}

.history-item {
  padding: 10px 4px;

  border-bottom: 1px solid #333;

  cursor: pointer;
}

.history-item:last-child {
  border-bottom: 0;
}

.history-expression {
  font-size: 14px;
  color: #999;
}

.history-answer {
  font-size: 17px;
  font-weight: 600;
  color: #fff;
}

.empty-history {
  color: #888;
  font-size: 14px;
}

/* LIGHT MODE */

body:not(.dark) {
  background: #f4f4f4;
  color: #111;
}

body:not(.dark) .calculator {
  background: #f4f4f4;
}

body:not(.dark) .app-name {
  color: #111;
}

body:not(.dark) .small-btn {
  background: #e9e9e9;
  color: #111;
}

body:not(.dark) button.key {
  background: #e9e9e9;
  color: #111;
}

body:not(.dark) button.operator {
  background: #e4e4e4;
  color: #111;
}

body:not(.dark) button.equal {
  background: #111;
  color: #fff;
}

body:not(.dark) .expression {
  color: #777;
}

body:not(.dark) .answer {
  color: #111;
}

/* SMALL PHONES */

@media (max-height: 700px) {

  .calculator {
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .display {
    padding-top: 8px;
    padding-bottom: 12px;
  }

  button.key {
    min-height: 58px;
  }

  .keys {
    gap: 8px;
  }
}

/* LARGE PHONES */

@media (min-height: 800px) {

  button.key {
    min-height: 72px;
  }

  .keys {
    gap: 13px;
  }
}
</style>
</head>

<body>

<div class="calculator" id="calculator">

  <div class="topbar">

    <div class="app-name">
      Calculator
    </div>

    <div class="top-actions">

      <button
        class="small-btn"
        id="historyBtn"
        type="button"
        aria-label="History">
        🕘
      </button>

      <button
        class="small-btn"
        id="themeBtn"
        type="button"
        aria-label="Theme">
        🌙
      </button>

    </div>

  </div>


  <div class="history-panel" id="historyPanel">

    <div class="history-title">
      History
    </div>

    <div id="historyList"></div>

  </div>


  <div class="display">

    <div
      class="expression"
      id="expression">
      0
    </div>

    <div
      class="answer"
      id="answer"
      title="Tap to copy">
      0
    </div>

    <div
      class="status"
      id="status">
    </div>

  </div>


  <div class="keys">

    <button
      class="key clear"
      data-action="clear"
      type="button">
      AC
    </button>

    <button
      class="key"
      data-action="backspace"
      type="button">
      ⌫
    </button>

    <button
      class="key"
      data-value="%"
      type="button">
      %
    </button>

    <button
      class="key operator"
      data-value="/"
      type="button">
      ÷
    </button>


    <button
      class="key"
      data-value="7"
      type="button">
      7
    </button>

    <button
      class="key"
      data-value="8"
      type="button">
      8
    </button>

    <button
      class="key"
      data-value="9"
      type="button">
      9
    </button>

    <button
      class="key operator"
      data-value="*"
      type="button">
      ×
    </button>


    <button
      class="key"
      data-value="4"
      type="button">
      4
    </button>

    <button
      class="key"
      data-value="5"
      type="button">
      5
    </button>

    <button
      class="key"
      data-value="6"
      type="button">
      6
    </button>

    <button
      class="key operator"
      data-value="-"
      type="button">
      −
    </button>


    <button
      class="key"
      data-value="1"
      type="button">
      1
    </button>

    <button
      class="key"
      data-value="2"
      type="button">
      2
    </button>

    <button
      class="key"
      data-value="3"
      type="button">
      3
    </button>

    <button
      class="key operator"
      data-value="+"
      type="button">
      +
    </button>


    <button
      class="key"
      data-value="."
      type="button">
      .
    </button>

    <button
      class="key zero"
      data-value="0"
      type="button">
      0
    </button>

    <button
      class="key equal"
      data-action="equals"
      type="button">
      =
    </button>

  </div>

</div>


<script>
(function () {

  const expressionEl =
    document.getElementById("expression");

  const answerEl =
    document.getElementById("answer");

  const statusEl =
    document.getElementById("status");

  const historyBtn =
    document.getElementById("historyBtn");

  const themeBtn =
    document.getElementById("themeBtn");

  const historyPanel =
    document.getElementById("historyPanel");

  const historyList =
    document.getElementById("historyList");


  let expression = "";

  let history = [];


  /* =========================
     DISPLAY
  ========================= */

  function displayExpression(text) {

    return text
      .replace(/\*/g, "×")
      .replace(/\//g, "÷")
      .replace(/-/g, "−");
  }


  function cleanExpression(text) {

    return text
      .replace(/×/g, "*")
      .replace(/÷/g, "/")
      .replace(/−/g, "-");
  }


  function formatNumber(number) {

    if (!Number.isFinite(number)) {
      return "Can't calculate";
    }

    if (Math.abs(number) >= 1e12) {
      return number.toExponential(8);
    }

    const rounded =
      Number(number.toFixed(10));

    return rounded.toLocaleString("en-IN");
  }


  /* =========================
     PERCENTAGE
  ========================= */

  function convertPercentage(expr) {

    expr = expr.replace(
      /(\d+(?:\.\d+)?)\s*([+\-*/])\s*(\d+(?:\.\d+)?)%$/,
      function(match, a, operator, b) {

        const first = Number(a);

        const percent = Number(b);


        if (operator === "+") {

          return (
            first +
            "+" +
            (first * percent / 100)
          );

        }


        if (operator === "-") {

          return (
            first +
            "-" +
            (first * percent / 100)
          );

        }


        if (operator === "*") {

          return (
            first +
            "*" +
            (percent / 100)
          );

        }


        if (operator === "/") {

          return (
            first +
            "/" +
            (percent / 100)
          );

        }


        return match;
      }
    );


    expr = expr.replace(
      /(\d+(?:\.\d+)?)%$/,
      function(match, number) {

        return String(
          Number(number) / 100
        );

      }
    );


    return expr;
  }


  /* =========================
     CALCULATE
  ========================= */

  function safeCalculate(expr) {

    if (!expr) {
      return null;
    }


    let clean =
      cleanExpression(expr);


    clean =
      clean.replace(/\s+/g, "");


    /*
      Remove incomplete percentage
      and check valid characters.
    */

    if (!/^[0-9+\-*/().%]+$/.test(clean)) {
      return null;
    }


    /*
      Expression cannot end
      with an operator.
    */

    if (/[+\-*/.]$/.test(clean)) {
      return null;
    }


    clean =
      convertPercentage(clean);


    try {

      const result =
        Function(
          '"use strict"; return (' +
          clean +
          ')'
        )();


      if (
        typeof result !== "number" ||
        !Number.isFinite(result)
      ) {
        return null;
      }


      return result;

    } catch {

      return null;
    }
  }


  /* =========================
     LIVE DISPLAY
  ========================= */

  function updateDisplay() {

    expressionEl.textContent =
      expression
        ? displayExpression(expression)
        : "0";


    if (!expression) {

      answerEl.textContent = "0";

      return;
    }


    const result =
      safeCalculate(expression);


    if (result !== null) {

      answerEl.textContent =
        formatNumber(result);

    } else {

      answerEl.textContent =
        "…";
    }
  }


  /* =========================
     ADD VALUE
  ========================= */

  function addValue(value) {

    statusEl.textContent = "";


    const operators =
      "+-*/";


    /*
      Operator
    */

    if (operators.includes(value)) {

      if (!expression) {

        if (value === "-") {

          expression = "-";

        }

        updateDisplay();

        return;
      }


      const last =
        expression.slice(-1);


      if (operators.includes(last)) {

        expression =
          expression.slice(0, -1) + value;

      } else {

        expression += value;
      }


      updateDisplay();

      return;
    }


    /*
      Decimal
    */

    if (value === ".") {

      const parts =
        expression.split(/[+\-*/]/);


      const current =
        parts[parts.length - 1];


      if (current.includes(".")) {
        return;
      }


      if (
        current === "" ||
        current === "-"
      ) {

        expression += "0.";

      } else {

        expression += ".";
      }


      updateDisplay();

      return;
    }


    /*
      Percentage
    */

    if (value === "%") {

      const last =
        expression.slice(-1);


      if (
        last &&
        !operators.includes(last) &&
        last !== "%"
      ) {

        expression += "%";
      }


      updateDisplay();

      return;
    }


    /*
      Number
    */

    expression += value;

    updateDisplay();
  }


  /* =========================
     CLEAR
  ========================= */

  function clearAll() {

    expression = "";

    statusEl.textContent = "";

    updateDisplay();
  }


  /* =========================
     BACKSPACE
  ========================= */

  function backspace() {

    expression =
      expression.slice(0, -1);

    statusEl.textContent = "";

    updateDisplay();
  }


  /* =========================
     EQUALS
  ========================= */

  function calculateFinal() {

    if (!expression) {
      return;
    }


    const result =
      safeCalculate(expression);


    if (result === null) {

      statusEl.textContent =
        "Can't calculate";

      return;
    }


    /*
      Save history.
    */

    addHistory(
      expression,
      result
    );


    /*
      IMPORTANT:
      Do NOT replace expression
      with result.

      This keeps:

      3 + 3
      6

      even after pressing "=".
    */

    answerEl.textContent =
      formatNumber(result);

    statusEl.textContent = "";
  }


  /* =========================
     HISTORY
  ========================= */

  function addHistory(expr, result) {

    history.unshift({
      expression: expr,
      result: result
    });


    if (history.length > 20) {

      history.pop();
    }


    renderHistory();
  }


  function renderHistory() {

    if (!history.length) {

      historyList.innerHTML =
        '<div class="empty-history">' +
        'No calculations yet' +
        '</div>';

      return;
    }


    historyList.innerHTML = "";


    history.forEach(function(item) {

      const div =
        document.createElement("div");


      div.className =
        "history-item";


      div.innerHTML =
        '<div class="history-expression">' +
        escapeHTML(
          displayExpression(item.expression)
        ) +
        '</div>' +

        '<div class="history-answer">' +
        escapeHTML(
          formatNumber(item.result)
        ) +
        '</div>';


      div.addEventListener(
        "click",
        function() {

          expression =
            String(item.result);

          historyPanel.classList.remove(
            "show"
          );

          updateDisplay();

        }
      );


      historyList.appendChild(div);

    });
  }


  function escapeHTML(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================
     BUTTONS
  ========================= */

  document
    .querySelectorAll(".key")
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          const value =
            button.dataset.value;

          const action =
            button.dataset.action;


          if (action === "clear") {

            clearAll();

            return;
          }


          if (action === "backspace") {

            backspace();

            return;
          }


          if (action === "equals") {

            calculateFinal();

            return;
          }


          if (value) {

            addValue(value);
          }

        }
      );

    });


  /* =========================
     HISTORY BUTTON
  ========================= */

  historyBtn.addEventListener(
    "click",
    function() {

      historyPanel.classList.toggle(
        "show"
      );

      renderHistory();

    }
  );


  /* =========================
     THEME
  ========================= */

  themeBtn.addEventListener(
    "click",
    function() {

      document.body.classList.toggle(
        "dark"
      );


      themeBtn.textContent =
        document.body.classList.contains("dark")
          ? "☀️"
          : "🌙";

    }
  );


  /* =========================
     COPY RESULT
  ========================= */

  answerEl.addEventListener(
    "click",
    async function() {

      const result =
        safeCalculate(expression);


      if (result === null) {
        return;
      }


      const text =
        String(result);


      try {

        if (navigator.clipboard) {

          await navigator.clipboard.writeText(
            text
          );

          statusEl.textContent =
            "Copied ✓";

        } else {

          statusEl.textContent =
            "Result: " + text;
        }

      } catch {

        statusEl.textContent =
          "Result: " + text;
      }


      setTimeout(
        function() {

          statusEl.textContent = "";

        },
        1200
      );

    }
  );


  /* =========================
     KEYBOARD
  ========================= */

  document.addEventListener(
    "keydown",
    function(event) {

      const key = event.key;


      if (
        /^[0-9.]$/.test(key) ||
        ["+", "-", "*", "/", "%"].includes(key)
      ) {

        event.preventDefault();

        addValue(key);

        return;
      }


      if (
        key === "Enter" ||
        key === "="
      ) {

        event.preventDefault();

        calculateFinal();

        return;
      }


      if (key === "Backspace") {

        event.preventDefault();

        backspace();

        return;
      }


      if (key === "Escape") {

        event.preventDefault();

        clearAll();
      }

    }
  );


  /* =========================
     START
  ========================= */

  updateDisplay();

  renderHistory();

})();
</script>

</body>
</html>
